substitutions:
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  wifi_ap_ssid: ${device_name} - FB
  wifi_ap_password: !secret wifi_ap_password
  esphome_api_key: !secret esphome_api_key
  esphome_ota_password: !secret esphome_ota_password

globals:
  - id: g_wifi_connected
    type: bool
    initial_value: "false"

ota:
  - platform: esphome
    password: $esphome_ota_password

wifi:
  ssid: $wifi_ssid
  password: $wifi_password
  ap:
    ssid: $wifi_ap_ssid
    password: $wifi_ap_password
  on_connect:
    then:
      - lambda: |-
          id(g_wifi_connected) = true;
  on_disconnect:
    then:
      - lambda: |-
          id(g_wifi_connected) = false;

captive_portal:

logger:

api:
  encryption:
    key: $esphome_api_key
  id: espapi
  reboot_timeout: 5min
